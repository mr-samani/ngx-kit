name: CI - Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # - name: Lint (در صورت وجود اسکریپت lint)
      #   run: npm run lint --if-present

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build
