name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci



      - name: Build demo
        run: npx ng build demo --configuration production --base-href /ngx-kit/
    
      - name: Copy index.html to 404.html (SPA fallback)
        run: cp dist/demo/browser/index.html dist/demo/browser/404.html
    
       
      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: ./dist/demo/browser
         publish_branch: docs
         keep_files: false