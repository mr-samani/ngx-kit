<app-example-showcase
  title="Data Table"
  [files]="sourceFiles"
  readmePath="/readmes/data-table/README.md">
  <h3>Users table (lazy loading, sorting, resizable columns, type-safe renderers)</h3>

  <ngx-table
    [data]="rows()"
    [totalRecords]="total()"
    [fields]="fields"
    [loading]="loading()"
    [multiSort]="true"
    [lazy]="true"
    (lazyLoad)="onLazyLoad($event)">
    <!--
    Custom template for the userName column. row/value here are typed any
    (a known limitation of this dynamic-projection approach); for full
    type-safety on row/value, use field.cellTemplate with ViewChild instead
    (see the README).
  -->
    <ng-template ngxTableCell="userName" let-user let-value="value">
      <strong>{{ value }}</strong>
      <small>{{ '@' + user.userName }}</small>
    </ng-template>
  </ngx-table>
</app-example-showcase>
