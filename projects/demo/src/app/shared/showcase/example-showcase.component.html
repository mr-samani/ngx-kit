<section class="playground-toolbar">
  <div class="toolbar-divider"></div>

  <div class="toolbar-group" role="tablist">
    <span class="toolbar-label">{{ lable() }}</span>
    <div class="segmented">
      <button
        type="button"
        role="tab"
        class="showcase-tab"
        [class.active]="activeTab() === ActiveTabEnum.Doc"
        [attr.aria-selected]="activeTab() === ActiveTabEnum.Doc"
        (click)="select(ActiveTabEnum.Doc)">
        Docs
      </button>

      <button
        type="button"
        role="tab"
        class="showcase-tab"
        [class.active]="activeTab() === ActiveTabEnum.Preview"
        [attr.aria-selected]="activeTab() === ActiveTabEnum.Preview"
        (click)="select(ActiveTabEnum.Preview)">
        Preview
      </button>
      @for (file of files(); track file.path; let i = $index) {
        <button
          type="button"
          role="tab"
          class="showcase-tab"
          [class.active]="activeTab() === i + 1"
          [attr.aria-selected]="activeTab() === i + 1"
          (click)="select(i + 1)">
          {{ file.label }}
        </button>
      }
    </div>
  </div>

  <div class="toolbar-spacer"></div>

  <!-- <span class="toolbar-button">
   
  </span> -->
</section>

<section class="showcase">
  <div class="showcase-panel">
    @if (activeTab() == ActiveTabEnum.Doc) {
      <div class="showcase-preview">
        <app-readme-viewer class="showcase-readme" [src]="readmePath()" dir="ltr" />
      </div>
    }
    @if (activeTab() === ActiveTabEnum.Preview) {
      <ng-content />
    }
    @for (file of files(); track file.path; let i = $index) {
      @if (activeTab() === i + 1) {
        <app-code-viewer class="showcase-code" [path]="file.path" [language]="file.language" />
      }
    }
  </div>
</section>
