<app-example-showcase
  title="Drawer Menu"
  [files]="sourceFiles"
  readmePath="readmes/drawer-menu/README.md">
  <div class="toolbar-group">
    <span class="toolbar-label">Mode</span>

    <div class="segmented">
      <button type="button" [class.active]="mode() === 'push'" (click)="setMode('push')">
        Push
      </button>

      <button type="button" [class.active]="mode() === 'overlay'" (click)="setMode('overlay')">
        Overlay
      </button>
    </div>
  </div>

  <div class="frame">
    <ngx-side-nav [mode]="mode()" [width]="220" class="my-drawer-menu">
      <div ngxDrawerMenu class="menu-content">
        <h4>My Menu</h4>
        <ul>
          <li>Home</li>
          <li>Profile</li>
          <li>Settings</li>
          <li>Sign out</li>
        </ul>
      </div>

      <div class="page-content">
        <button type="button" ngxDrawerMenuToggle>
          <i class="fa fa-bars"></i>
        </button>
        <p>This is the page's main content.</p>
        <p>Change "contentBehavior" to see how it reacts.</p>
      </div>
    </ngx-side-nav>
  </div>
</app-example-showcase>
