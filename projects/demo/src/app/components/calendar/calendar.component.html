<app-example-showcase
  title="Calendar"
  [files]="sourceFiles"
  readmePath="readmes/date-picker/README.md">
  <div class="row">
    <select name="locale" [(ngModel)]="locale">
      @for (item of availableLocals; track $index) {
        <option [value]="item">{{ item }}</option>
      }
    </select>
  </div>
  <ngx-calendar
    [locale]="locale"
    [events]="myEvents"
    (selectEvent)="onSelectEvent($event)"></ngx-calendar>
</app-example-showcase>
