<app-example-showcase
  title="Color Picker"
  [files]="sourceFiles"
  readmePath="readmes/color-picker/README.md">
  <div class="input-group">
    <button (click)="cpInput.toggle()" class="input-group-text pointer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="22">
        <path
          d="M64 264C64 241.9 81.91 224 104 224H184C206.1 224 224 241.9 224 264V344C224 366.1 206.1 384 184 384H104C81.91 384 64 366.1 64 344V264zM96 264V344C96 348.4 99.58 352 104 352H184C188.4 352 192 348.4 192 344V264C192 259.6 188.4 256 184 256H104C99.58 256 96 259.6 96 264zM128 64H320V16C320 7.164 327.2 0 336 0C344.8 0 352 7.164 352 16V64H384C419.3 64 448 92.65 448 128V448C448 483.3 419.3 512 384 512H64C28.65 512 0 483.3 0 448V128C0 92.65 28.65 64 64 64H96V16C96 7.164 103.2 0 112 0C120.8 0 128 7.164 128 16V64zM32 448C32 465.7 46.33 480 64 480H384C401.7 480 416 465.7 416 448V192H32V448zM32 128V160H416V128C416 110.3 401.7 96 384 96H64C46.33 96 32 110.3 32 128z" />
      </svg>
    </button>
    <input
      type="text"
      [(ngModel)]="color"
      ngxInputColor
      class="form-control"
      [simpleMode]="simpleMode"
      [outputType]="outputType"
      [defaultInspector]="inspector"
      [useAlphaChannel]="useAlphaChannel"
      #cpInput="ngxInputColor" />
    <button type="button" (click)="color = ''">x</button>
  </div>

  <div>
    <label>
      <input type="checkbox" name="simpleMode" [(ngModel)]="simpleMode" />
      Simple Mode
    </label>
  </div>

  <div>
    <label>
      <input type="checkbox" name="alphaChannel" [(ngModel)]="useAlphaChannel" />
      Alpha channel
    </label>
  </div>

  Output:
  <div class="radio-group">
    <label>
      <input type="radio" name="outputtype" value="HEX" [(ngModel)]="outputType" />
      HEX
    </label>
    <label>
      <input type="radio" name="outputtype" value="RGB" [(ngModel)]="outputType" />
      RGB
    </label>
    <label>
      <input type="radio" name="outputtype" value="HSV" [(ngModel)]="outputType" />
      HSV
    </label>
    <label>
      <input type="radio" name="outputtype" value="HSL" [(ngModel)]="outputType" />
      HSL
    </label>
    <label>
      <input type="radio" name="outputtype" value="CMYK" [(ngModel)]="outputType" />
      CMYK
    </label>
  </div>
  Inspector:
  <div class="radio-group">
    <label>
      <input
        type="radio"
        name="inspector"
        [value]="ColorInspector.Picker"
        [(ngModel)]="inspector" />
      Picker
    </label>
    <label>
      <input type="radio" name="inspector" [value]="ColorInspector.RGB" [(ngModel)]="inspector" />
      RGB
    </label>
    <label>
      <input type="radio" name="inspector" [value]="ColorInspector.HSL" [(ngModel)]="inspector" />
      HSL
    </label>
    <label>
      <input type="radio" name="inspector" [value]="ColorInspector.CMYK" [(ngModel)]="inspector" />
      CMYK
    </label>
  </div>
  Theme:
  <div class="radio-group">
    <label>
      <input type="radio" name="theme" value="light" [(ngModel)]="theme" />
      Light
    </label>
    <label>
      <input type="radio" name="theme" value="dark" [(ngModel)]="theme" />
      Dark
    </label>
    <label>
      <input type="radio" name="theme" value="auto" [(ngModel)]="theme" />
      Auto
    </label>
  </div>
  <p>{{ color }}</p>
</app-example-showcase>
