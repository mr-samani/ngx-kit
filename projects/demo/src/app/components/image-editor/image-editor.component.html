<app-example-showcase
  lable="Image Editor"
  [files]="sourceFiles"
  readmePath="readmes/image-editor/README.md">
  @if (!selectedFile() && !result()) {
    <ngx-dropzone [accept]="'image/*'" [multiple]="false" (filesAdded)="onFilesAdded($event)">
      Select an image to edit
    </ngx-dropzone>
  }

  @if (selectedFile(); as file) {
    <ngx-image-editor
      [source]="file"
      [quality]="100"
      (saved)="onSaved($event)"
      (cancelled)="onCancelled()" />
  }

  @if (result(); as r) {
    <div class="ie-result">
      <img [src]="r.dataUrl" [alt]="'Edited output'" />
      <p>{{ r.width }}×{{ r.height }}</p>
      <button type="button" class="demo-button primary" (click)="reset()">
        Edit another image
      </button>
    </div>
  }
</app-example-showcase>
