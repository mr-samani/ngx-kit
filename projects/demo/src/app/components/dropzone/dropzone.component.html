<app-example-showcase title="Dropzone" [files]="sourceFiles">
  <ngx-dropzone
    [accept]="'image/*'"
    [maxFileSize]="5 * 1024 * 1024"
    [maxFiles]="5"
    (filesAdded)="onFilesAdded($event)"
    (filesRejected)="onFilesRejected($event)"
  >
    تصاویر را اینجا رها کنید (حداکثر ۵ فایل، هرکدام تا ۵ مگابایت)
  </ngx-dropzone>

  @if (acceptedCount()) {
    <p>{{ acceptedCount() }} فایل پذیرفته شد.</p>
  }
  @if (rejected().length) {
    <p class="rejected-note">
      {{ rejected().length }} فایل رد شد (نوع/حجم/تعداد نامعتبر).
    </p>
  }
</app-example-showcase>
