<div class="main-content">
  @for (cat of list; track $index) {
    <div class="accordion" [class.open]="cat.open">
      <div class="accordion-title">
        <span>{{ cat.name }}</span>
        <button (click)="cat.open = !cat.open">
          @if (cat.open) {
            <i class="fa fa-chevron-up"></i>
          } @else {
            <i class="fa fa-chevron-down"></i>
          }
        </button>
      </div>
      <div class="accordion-body">
        <div class="card-container">
          @for (item of cat.items; track $index) {
            <div class="card" [routerLink]="item.url">
              <figure>
                <img [src]="item.image ?? defaultImage" [alt]="item.title" />
              </figure>
              <h3 class="card-title">{{ item.title }}</h3>
              <p class="card-body">{{ item.description }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
