<header class="app-header">
  <a class="brand" routerLink="/">
    <span class="brand-mark">NK</span>
    <span class="brand-name">
      ngx
      <b>kit</b>
    </span>
  </a>

  <nav class="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/components" routerLinkActive="active">Components</a>
  </nav>

  <div class="spacer"></div>

  <button
    type="button"
    class="icon-btn"
    aria-label="Toggle page direction"
    (click)="direction.toggleDirection()">
    @if (direction.isRtl()) {
      <span class="dir-label">LTR</span>
    } @else {
      <span class="dir-label">RTL</span>
    }
  </button>

  <button type="button" class="icon-btn" aria-label="Toggle theme" (click)="darkMode.toggleDarkMode()">
    @if (darkMode.isDarkMode()) {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6" />
        <path
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path
          d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round" />
      </svg>
    }
  </button>

  <a
    class="icon-btn"
    href="https://github.com"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="GitHub">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path
        d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.46-1.2-1.11-1.52-1.11-1.52-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.9 1.56 2.36 1.11 2.93.85.09-.66.35-1.11.64-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.2C22 6.58 17.52 2 12 2z" />
    </svg>
  </a>
</header>
