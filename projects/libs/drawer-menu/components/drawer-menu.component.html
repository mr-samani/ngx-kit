<div
  class="ngx-drawer-root"
  [class.is-open]="drawerVisible()"
  [class.is-closed]="!drawerVisible()"
  [class.is-overlay]="isOverlay()"
  [class.is-dock]="isDocked()"
  [class.is-pinned]="pinned()"
  [class.is-mobile]="currentMode() === 'mobile'"
  [class.is-desktop]="currentMode() === 'desktop'"
  (keydown)="onKeyDown($event)"
  tabindex="-1">
  <!-- ===================================================================== -->
  <!-- Backdrop                                                               -->
  <!-- ===================================================================== -->

  @if (shouldShowBackdrop()) {
    <div class="ngx-drawer-backdrop" aria-hidden="true" (click)="onBackdropClick()"></div>
  }

  <!-- ===================================================================== -->
  <!-- Drawer                                                                 -->
  <!-- ===================================================================== -->

  <aside
    class="ngx-drawer"
    [attr.aria-hidden]="!drawerVisible()"
    [attr.data-side]="side()"
    [attr.data-mode]="currentMode()"
    [attr.data-behavior]="currentBehavior()"
    [attr.data-effect]="effect()"
    [attr.data-pinned]="pinned()">
    <div class="ngx-drawer-surface">
      <!-- Drawer Content -->
      <div class="ngx-drawer-content">
        <ng-content select="[drawerContent]"></ng-content>
      </div>
    </div>
  </aside>

  <!-- ===================================================================== -->
  <!-- Main Content                                                           -->
  <!-- ===================================================================== -->

  <main class="ngx-drawer-main">
    <div class="ngx-drawer-main-content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
