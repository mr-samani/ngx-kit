<div
  class="ngx-drawer"
  [class.is-open]="isActuallyOpen()"
  [class.is-dragging]="isDragging()"
  [class.is-pinned]="pinned()"
  [class.side-start]="side() === 'start'"
  [class.side-end]="side() === 'end'"
  [class.mode-overlay]="mode() === 'overlay'"
  [class.mode-push]="mode() === 'push'"
  [class.mode-reveal]="mode() === 'reveal'"
  [class.effect-slide]="effect() === 'slide'"
  [class.effect-spring]="effect() === 'spring'"
  [class.effect-fabric]="effect() === 'fabric'"
  [class.effect-curtain]="effect() === 'curtain'"
  [class.effect-elastic]="effect() === 'elastic'"
  [class.effect-reveal]="effect() === 'reveal'"
  [style.--ngx-progress]="progress()"
  [style.--ngx-width.px]="width()"
  [style.--ngx-edge-size.px]="edgeSize()"
  [style.--ngx-max-width.px]="maxWidth()"
  [style.--ngx-duration]="duration()"
  [style.--ngx-backdrop-opacity]="backdropOpacity()"
  [style.--ngx-physical-sign]="physicalSign()"
  [style.--ngx-closed-translate.px]="(1 - progress()) * -width() * physicalSign()"
  [style.--ngx-transform-origin]="isPhysicalLeft() ? 'left center' : 'right center'"
  [style.--ngx-fabric-skew]="(1 - progress()) * 10 + 'deg'">
  @if (swipeEnabled() && !isActuallyOpen() && !pinned()) {
    <div
      class="ngx-drawer-edge-zone"
      [class.edge-start]="side() === 'start'"
      [class.edge-end]="side() === 'end'"
      (pointerdown)="onEdgePointerDown($event)"
      aria-hidden="true"></div>
  }

  @if (isActuallyOpen() && mode() === 'overlay') {
    <button
      class="ngx-drawer-backdrop"
      type="button"
      tabindex="-1"
      aria-label="Close navigation"
      (pointerdown)="onBackdropPointerDown($event)"></button>
  }

  <main class="ngx-drawer-main">
    <ng-content></ng-content>

    @if (isActuallyOpen() && mode() !== 'overlay') {
      <button
        class="ngx-drawer-main-dim"
        type="button"
        tabindex="-1"
        aria-label="Close navigation"
        (pointerdown)="onBackdropPointerDown($event)"></button>
    }
  </main>

  <aside
    class="ngx-drawer-panel"
    [attr.aria-hidden]="!isActuallyOpen()"
    [attr.inert]="!isActuallyOpen() ? '' : null"
    role="navigation">
    <div class="ngx-drawer-fabric" aria-hidden="true">
      <div class="ngx-fabric-fold fold-1"></div>
      <div class="ngx-fabric-fold fold-2"></div>
      <div class="ngx-fabric-fold fold-3"></div>
      <div class="ngx-fabric-fold fold-4"></div>
      <div class="ngx-fabric-edge"></div>
    </div>

    <div
      class="ngx-drawer-grip"
      [class.grip-start]="side() === 'start'"
      [class.grip-end]="side() === 'end'"
      (pointerdown)="onPanelPointerDown($event)"
      aria-hidden="true">
      <span></span>
    </div>

    <div class="ngx-drawer-inner">
      <div class="ngx-drawer-content">
        <ng-content select="[drawerContent]"></ng-content>
      </div>
    </div>

    @if (effect() === 'curtain') {
      <div class="ngx-drawer-curtain" aria-hidden="true">
        @for (i of strips(); track i) {
          <span
            class="ngx-drawer-strip"
            [style.--strip-index]="i"
            [style.--strip-count]="curtainStrips()"></span>
        }
      </div>
    }
  </aside>
</div>
