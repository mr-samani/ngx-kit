<!-- form-field.component.html -->

<div class="mx-form-field" [class.float]="float()">
  <div class="mx-form-field_before">
    <div class="mx-form-field_prefix">
      <ng-content select="[ngxPrefix],ngx-prefix"></ng-content>
    </div>
  </div>

  <ng-content select="[ngxInput],ngx-input"></ng-content>
  <label class="mx-form-field_label">
    <span>{{ label() }}</span>
  </label>

  <div class="mx-form-field_after">
    <div class="mx-form-field_suffix">
      <ng-content select="[ngxSuffix],ngx-suffix"></ng-content>
    </div>
  </div>
</div>

<div class="mx-form-field_hint">
  <ng-content select="[ngxHint],ngx-hint"></ng-content>
</div>

<div class="mx-form-field_error-list" role="alert">
  <ng-content select="[ngxError],ngx-error"></ng-content>
</div>
