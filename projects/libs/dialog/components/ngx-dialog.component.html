@if (config.header?.enable) {
  <div
    ngxDialogHeader
    [showCloseButton]="config.header?.showCloseButton ?? true"
    [showMaximizeButton]="config.header?.showMaximizeButton ?? true">
    {{ config.header?.title }}
  </div>
}

<ng-container *ngComponentOutlet="content" />

@if (config.footer?.enable) {
  <div ngxDialogFooter [align]="config.footer?.align ?? 'end'">
    <button type="button" class="ngx-dialog-default-close-btn" (click)="dialogRef.close()">
      {{ config.footer?.closeText ?? 'Close' }}
    </button>
  </div>
}
