<div class="ngx-shadow-control">
  <div class="tc-head">
    <span class="tc-title">Shadow</span>
  </div>

  <div
    class="pad-container"
    #pad
    aria-hidden="true"
    (mousedown)="onPadClick($event)"
    (touchstart)="onPadClick($event)">
    <div class="tc-stage-grid"></div>
    <div class="card-sample" [style.boxShadow]="selectedShadow().cssValue"></div>
    <svg
      class="flashlight-svg"
      viewBox="0 0 640 512"
      xmlns="http://www.w3.org/2000/svg"
      #flashlight
      [style.left.px]="x()"
      [style.top.px]="y()"
      (mousedown)="dragStart($event)"
      (touchstart)="dragStart($event)">
      <defs>
        <style>
          .fa-secondary {
            opacity: 0.4;
          }
        </style>
      </defs>
      <path
        class="fa-primary"
        d="M607.1 96h-32v320h32c17.62 0 32-14.38 32-32V128C639.1 110.4 625.6 96 607.1 96zM287.1 224h-32c-17.62 0-32 14.38-32 32s14.38 32 32 32h32c17.62 0 32-14.38 32-32S305.6 224 287.1 224z" />
      <path
        class="fa-secondary"
        d="M400.1 149.2L383.1 160H31.1c-17.62 0-32 14.38-32 32v128c0 17.62 14.38 32 32 32h352l16.12 10.75C443.2 391.5 511.1 416 575.1 416V96C511.1 96 443.2 120.5 400.1 149.2zM287.1 288h-32c-17.62 0-32-14.38-32-32s14.38-32 32-32h32c17.62 0 32 14.38 32 32S305.6 288 287.1 288z" />
    </svg>
  </div>

  <div class="inner">
    <div class="ee-tabs" role="tablist" aria-label="Easing type">
      <button
        type="button"
        role="tab"
        [class.on]="!selectedShadow().inset"
        [attr.aria-selected]="!selectedShadow().inset"
        (click)="changeInset(false)">
        Outside
      </button>
      <button
        type="button"
        role="tab"
        [class.on]="selectedShadow().inset"
        [attr.aria-selected]="selectedShadow().inset"
        (click)="changeInset(true)">
        Inside
      </button>
    </div>

    <table>
      <tr>
        <th>
          <span>X</span>
        </th>
        <td>
          <input
            type="range"
            class="kit-range"
            [min]="-maxRange()"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().xOffset"
            (ngModelChange)="updateShadow({ xOffset: selectedShadow().xOffset })" />
        </td>
        <td>
          <input
            type="number"
            class="kit-number"
            [min]="-maxRange()"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().xOffset"
            (ngModelChange)="updateShadow({ xOffset: selectedShadow().xOffset })" />
        </td>
      </tr>
      <tr>
        <th>
          <span>Y</span>
        </th>
        <td>
          <input
            type="range"
            class="kit-range"
            [min]="-maxRange()"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().yOffset"
            (ngModelChange)="updateShadow({ yOffset: selectedShadow().yOffset })" />
        </td>
        <td>
          <input
            type="number"
            class="kit-number"
            [min]="-maxRange()"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().yOffset"
            (ngModelChange)="updateShadow({ yOffset: selectedShadow().yOffset })" />
        </td>
      </tr>
      <tr>
        <th>
          <span>Blur</span>
        </th>
        <td>
          <input
            type="range"
            class="kit-range"
            [min]="0"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().blurRadius"
            min="0"
            (ngModelChange)="updateShadow({ blurRadius: selectedShadow().blurRadius })" />
        </td>
        <td>
          <input
            type="number"
            class="kit-number"
            [min]="0"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().blurRadius"
            min="0"
            (ngModelChange)="updateShadow({ blurRadius: selectedShadow().blurRadius })" />
        </td>
      </tr>
      <tr>
        <th>
          <span>Spread</span>
        </th>
        <td>
          <input
            type="range"
            class="kit-range"
            [min]="0"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().spreadRadius"
            (ngModelChange)="updateShadow({ spreadRadius: selectedShadow().spreadRadius })" />
        </td>
        <td>
          <input
            type="number"
            class="kit-number"
            [min]="0"
            [max]="maxRange()"
            [(ngModel)]="selectedShadow().spreadRadius"
            (ngModelChange)="updateShadow({ spreadRadius: selectedShadow().spreadRadius })" />
        </td>
      </tr>
      <tr>
        <th>
          <span>Color</span>
        </th>
        <td>
          <input
            type="text"
            class="kit-color"
            [(ngModel)]="selectedShadow().color"
            (ngModelChange)="updateShadow({ color: selectedShadow().color })"
            ngxInputColor
            [simpleMode]="true" />
        </td>
      </tr>
    </table>
  </div>
</div>
