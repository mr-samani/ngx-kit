<div class="trc">
  <div class="kit-head">
    <span class="kit-title">Shadow</span>
    <span class="kit-actions">
      <button (click)="addShadow(list)" type="button" class="kit-add">
        <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
          <path
            d="M6 1v10M1 6h10"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round" />
        </svg>
      </button>
    </span>
  </div>
  <ul class="kit-list" role="list" #list>
    @for (item of shadows(); let i = $index; track i) {
      <li
        #row
        class="kit-row"
        role="listitem"
        tabindex="0"
        [class.on]="i == selectedIndex()"
        (click)="setShadow(row, item, i)"
        (keydown.enter)="setShadow(row, item, i)"
        (keydown.space)="$event.preventDefault(); setShadow(row, item, i)">
        <span class="kit-text">{{ item.cssValue }}</span>
        <span class="kit-ops">
          <button
            type="button"
            class="kit-icon"
            title="Duplicate"
            aria-label="Duplicate"
            (click)="duplicate($event, i)">
            ⧉
          </button>
          <button
            type="button"
            class="kit-icon del"
            title="Remove"
            aria-label="Remove"
            (click)="removeShadow($event, i)">
            ✕
          </button>
        </span>
      </li>
    }
  </ul>
</div>
