@if (swipeEnabled() && !open()) {
  <div
    class="ngx-side-menu-edge-zone"
    [class.edge-start]="side() === 'start'"
    [class.edge-end]="side() === 'end'"
    [style.--ngx-side-menu-edge-size]="swipeEdgeSize() + 'px'"
    (mousedown)="onEdgeDragStart($event)"
    (touchstart)="onEdgeDragStart($event)"
  ></div>
}

@if (visualOpen() > 0) {
  <div
    class="ngx-side-menu-backdrop"
    [style.opacity]="visualOpen()"
    [class.no-transition]="isDragging()"
    (click)="closeFromBackdrop()"
  ></div>
}

<aside
  class="ngx-side-menu-panel"
  [class.side-start]="side() === 'start'"
  [class.side-end]="side() === 'end'"
  [class.no-transition]="isDragging()"
  [style.--ngx-side-menu-width]="width() + 'px'"
  [style.--ngx-side-menu-open]="visualOpen()"
  role="dialog"
  aria-modal="true"
>
  <div
    class="ngx-side-menu-drag-handle"
    [class.edge-start]="side() === 'start'"
    [class.edge-end]="side() === 'end'"
    (mousedown)="onPanelDragStart($event)"
    (touchstart)="onPanelDragStart($event)"
  ></div>

  <div class="ngx-side-menu-content">
    <ng-content></ng-content>
  </div>

  <div class="ngx-side-menu-curtain" [class.open]="open()" [class.revealed]="visualOpen() >= 1 && !isDragging()">
    @for (i of strips(); track i) {
      <div
        class="ngx-side-menu-strip"
        [class.side-start]="side() === 'start'"
        [class.side-end]="side() === 'end'"
        [style.transition-delay]="stripDelay(i)"
      ></div>
    }
  </div>
</aside>
