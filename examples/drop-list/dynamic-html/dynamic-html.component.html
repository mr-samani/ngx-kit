<app-example-showcase
  lable="Dynamic HTML Drop List"
  [files]="sourceFiles"
  readmePath="readmes/drag-resize/README.md">
  <p class="demo-field-hint">
    The list mixes native elements and directives; drag each one to reorder the live markup.
  </p>
  <div ngxDropList class="example-list" (drop)="drop($event, items)" id="el_baseList">
    <!-- <span class="placeholder" *ngxPlaceholder></span> -->

    @for (item of items; track $index) {
      @switch (item.tag) {
        @case ('div') {
          <div class="box" ngxDraggable [id]="item.title">{{ item.title }}</div>
        }
        @case ('input') {
          <input
            type="text"
            ngxDraggable
            [ignoreInteractive]="false"
            [attr.aria-label]="'Draggable input ' + item.title"
            [value]="'input ' + item.title"
            [id]="item.title" />
        }
        @case ('button') {
          <button
            ngxDraggable
            [ignoreInteractive]="true"
            [attr.aria-label]="'Show details for ' + item.title"
            [id]="item.title"
            (click)="alert(item.title)">
            btn-{{ item.title }}
          </button>
        }
      }
    }
  </div>
  <!-- <pre>{{ items | json }}</pre> -->

  <pre class="markup-output" aria-label="Current list markup">{{ items | json }}</pre>
