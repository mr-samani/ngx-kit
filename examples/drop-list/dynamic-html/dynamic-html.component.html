<div ngxDropList class="example-list" (drop)="drop($event, items)" id="el_baseList">
  <!-- <span class="placeholder" *ngxPlaceholder></span> -->

  @for (item of items; track $index) {
    @switch (item.tag) {
      @case ('div') {
        <div class="box" ngxDraggable [id]="item.title">{{ item.title }}</div>
      }
      @case ('input') {
        <input
          type="text"
          ngxDraggable
          [ignoreInteractive]="false"
          [value]="'input ' + item.title"
          [id]="item.title" />
      }
      @case ('button') {
        <button
          ngxDraggable
          [ignoreInteractive]="true"
          [id]="item.title"
          (click)="alert(item.title)">
          btn-{{ item.title }}
        </button>
      }
    }
  }
</div>
<!-- <pre>{{ items | json }}</pre> -->
