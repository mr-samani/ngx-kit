<app-header [showMenuButton]="true" (onToggleMenu)="mnuBtn.click()"></app-header>

<ngx-side-nav [width]="300" [breakpoint]="960" class="side-nav" mode="overlay" #sideNav>
  <app-side-nav
    ngxDrawerMenu
    (onMenuItemClick)="sideNav.shouldShowOverlay() ? sideNav.closeMenu() : ''"></app-side-nav>
  <button
    #mnuBtn
    ngxDrawerMenuToggle
    [hideOnBreakPoint]="true"
    type="button"
    class="mobile-menu-toggle"
    aria-label="Open components list">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
      <path
        d="M4 6h16M4 12h16M4 18h16"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round" />
    </svg>
  </button>
  <router-outlet />
</ngx-side-nav>
