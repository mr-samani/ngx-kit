<app-example-showcase
  lable="Drawer Menu"
  [files]="sourceFiles"
  readmePath="readmes/side-nav/README.md">
  <div class="toolbar-group">
    <span class="toolbar-label">Mode</span>

    <div class="segmented">
      <button type="button" [class.active]="mode() === 'push'" (click)="setMode('push')">
        Push
      </button>

      <button type="button" [class.active]="mode() === 'overlay'" (click)="setMode('overlay')">
        Overlay
      </button>
    </div>
  </div>

  <div class="frame">
    <ngx-side-nav [mode]="mode()" [width]="220" class="my-drawer-menu" id="drawer-demo">
      <div ngxDrawerMenu class="menu-content">
        <h4>My Menu</h4>
        <nav aria-label="Demo pages">
          <ul>
            @for (page of pages; track page) {
              <li>
                <button
                  type="button"
                  [class.active]="activePage() === page"
                  [attr.aria-current]="activePage() === page ? 'page' : null"
                  (click)="selectPage(page)">
                  {{ page }}
                </button>
              </li>
            }
          </ul>
        </nav>
      </div>

      <div class="page-content">
        <button type="button" ngxDrawerMenuToggle aria-label="Toggle navigation menu">
          <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <h2>{{ activePage() }}</h2>
        <p>This content changes when you choose a destination in the drawer.</p>
        <p>Change the mode above to compare push and overlay navigation.</p>
      </div>
    </ngx-side-nav>
  </div>
</app-example-showcase>
