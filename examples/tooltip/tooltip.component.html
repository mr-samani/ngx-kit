<app-example-showcase [files]="sourceFiles" readmePath="readmes/tooltip/README.md">
  <div class="demo-playground">
    <!-- =====================================================
         CONTENT
         ===================================================== -->
    <div class="config-preview">
      <div class="demo-configuration">
        <section class="demo-section">
          <div class="demo-section-header">
            <div>
              <h3 class="demo-section-title">Content</h3>
            </div>

            <span class="badge">Tooltip</span>
          </div>

          <div class="demo-grid">
            <label class="demo-field">
              <span class="demo-field-label">Tooltip test</span>
              <textarea
                class="demo-input"
                type="text"
                [(ngModel)]="tooltipContent"
                name="message"
                placeholder="Tooltip message"></textarea>
            </label>
          </div>

          <!-- =====================================================
         placement
         ===================================================== -->
          <div class="demo-section-header">
            <div>
              <h3 class="demo-section-title">Placement</h3>
              <p class="demo-section-description">Select the tooltip placement.</p>
            </div>
          </div>

          <div class="demo-choice">
            @for (item of placements; track $index) {
              <button
                type="button"
                class="demo-choice-item"
                [class.active]="placement() === item"
                (click)="placement.set(item)">
                {{ item | titlecase }}
              </button>
            }
          </div>
          <!-- =====================================================
         Trigger
         ===================================================== -->
          <div class="demo-section-header">
            <div>
              <h3 class="demo-section-title">Trigger</h3>
              <p class="demo-section-description">Select the tooltip trigger.</p>
            </div>
          </div>
          <div class="demo-radio-group">
            @for (item of triggers; track $index) {
              <label class="demo-radio">
                <input type="radio" name="trigger" [(ngModel)]="trigger" [value]="item" />
                <span class="demo-radio-dot"></span>
                {{ item | uppercase }}
              </label>
            }
          </div>

          <!-- =====================================================
         Other
         ===================================================== -->

          <div class="demo-section-header">
            <div>
              <h3 class="demo-section-title">Other</h3>
            </div>
          </div>
          <div class="demo-grid">
            <label class="demo-field">
              <span class="demo-field-label">Offset</span>

              <input class="demo-input" type="number" [(ngModel)]="offset" name="offset" />
            </label>

            <label class="demo-field">
              <span class="demo-field-label">Delay</span>

              <input class="demo-input" type="number" [(ngModel)]="delay" name="delay" />
            </label>
            <label class="demo-field">
              <span class="demo-field-label">Hide Delay</span>

              <input class="demo-input" type="number" [(ngModel)]="hideDelay" name="hideDelay" />
            </label>
            <label class="demo-check">
              <input type="checkbox" [(ngModel)]="useHtml" name="allowHtml" />

              <span class="demo-check-box"></span>

              <span>Allow Html</span>
            </label>
            <label class="demo-check">
              <input type="checkbox" [(ngModel)]="usePopOver" name="usePopover" />

              <span class="demo-check-box"></span>

              <span>User Popover Overlay</span>
            </label>
          </div>
        </section>
      </div>
      <div class="demo-preview">
        <section class="demo-section">
          <!-- =====================================================
         ACTUAL COMPONENT
         ===================================================== -->

          <div class="demo-section-header">
            <div>
              <h3 class="demo-section-title">Preview</h3>
            </div>
          </div>

          <div class="demo-preview">
            <div class="demo-preview-content">
              <span
                class="prv-tltp"
                [ngxTooltip]="tooltipContent()"
                [ngxTooltipDelay]="delay()"
                [ngxTooltipHideDelay]="hideDelay()"
                [ngxTooltipTrigger]="trigger()"
                [ngxTooltipPlacement]="placement()"
                [ngxTooltipOffset]="offset()"
                [ngxTooltipAllowHtml]="useHtml()"
                [ngxTooltipUseOverlay]="usePopOver()">
                Custom element
              </span>

              <input
                type="text"
                [ngxTooltip]="tooltipContent()"
                [ngxTooltipDelay]="delay()"
                [ngxTooltipHideDelay]="hideDelay()"
                [ngxTooltipTrigger]="trigger()"
                [ngxTooltipPlacement]="placement()"
                [ngxTooltipOffset]="offset()"
                [ngxTooltipAllowHtml]="useHtml()"
                [ngxTooltipUseOverlay]="usePopOver()"
                placeholder="Sample Tooltip on text box" />
            </div>
          </div>
          <!-- =====================================================
         LIVE PAYLOAD
         ===================================================== -->
        </section>
      </div>
    </div>
  </div>
</app-example-showcase>
